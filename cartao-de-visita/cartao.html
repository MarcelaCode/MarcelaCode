<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Cartão de visita — Gabriel Aziz</title>
<style>
@font-face{font-family:'CG';font-weight:500;src:url(fonts/cormorant-garamond-latin-500-normal.woff2)}
@font-face{font-family:'CG';font-weight:600;src:url(fonts/cormorant-garamond-latin-600-normal.woff2)}
@font-face{font-family:'CG';font-weight:500;font-style:italic;src:url(fonts/cormorant-garamond-latin-500-italic.woff2)}
@font-face{font-family:'IN';font-weight:100 900;src:url(fonts/inter-latin-wght-normal.woff2)}
@page{size:96mm 56mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff}
/* Formato final 90x50 mm + 3 mm de sangria em cada lado = 96x56 mm */
.card{width:96mm;height:56mm;position:relative;overflow:hidden;page-break-after:always;break-after:page}
.card:last-child{page-break-after:auto;break-after:auto}
.safe{position:absolute;inset:7mm} /* margem de segurança: 4 mm dentro do corte */
/* FRENTE */
.front{background:#101D32;color:#fff;font-family:'IN'}
.front .glow{position:absolute;inset:0;background:radial-gradient(60% 90% at 88% 15%,rgba(184,155,98,.22),transparent 70%),radial-gradient(50% 70% at 0% 100%,rgba(31,53,82,.9),transparent 70%)}
.front .frame{position:absolute;inset:6mm;border:.25mm solid rgba(184,155,98,.7)}
.front .frame::after{content:'';position:absolute;inset:1.2mm;border:.12mm solid rgba(184,155,98,.35)}
.front .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mono{width:12mm;height:12mm;border:.3mm solid #B89B62;border-radius:50%;display:grid;place-items:center;font-family:'CG';font-weight:600;font-size:15pt;color:#B89B62;letter-spacing:.2mm;padding-bottom:.4mm}
.name{font-family:'CG';font-weight:600;font-size:25pt;line-height:1;margin-top:4.2mm;letter-spacing:.2mm}
.name i{color:#d6c196;font-weight:500}
.rule{width:10mm;height:.25mm;background:#B89B62;margin:3.4mm 0 2.8mm}
.role{font-size:5.4pt;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:#B89B62;padding-left:.32em}
/* VERSO */
.back{background:#fff;color:#292D32;font-family:'IN'}
.back .band{position:absolute;left:0;top:0;bottom:0;width:41mm;background:#101D32}
.back .band::after{content:'';position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 100%,rgba(184,155,98,.25),transparent 70%)}
.bmono{position:absolute;left:0;top:0;bottom:0;width:41mm;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4mm}
.ring{width:22mm;height:22mm;border:.3mm solid #B89B62;border-radius:50%;display:grid;place-items:center;position:relative}
.ring::after{content:'';position:absolute;inset:1.1mm;border:.12mm solid rgba(184,155,98,.4);border-radius:50%}
.ring span{font-family:'CG';font-weight:600;font-size:27pt;color:#B89B62;letter-spacing:.3mm;padding-bottom:.8mm}
.bl{width:8mm;height:.25mm;background:#B89B62}
.info{position:absolute;left:47mm;right:7mm;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
.info .n{font-family:'CG';font-weight:600;font-size:15pt;color:#101D32;line-height:1}
.info .r{font-size:4.2pt;font-weight:600;letter-spacing:.12em;white-space:nowrap;text-transform:uppercase;color:#8A6F3A;margin-top:1.6mm}
.info .l{width:8mm;height:.25mm;background:#B89B62;margin:3mm 0 3mm}
.row{display:flex;align-items:center;gap:2mm;font-size:6pt;line-height:1;margin-bottom:2.1mm;color:#292D32;white-space:nowrap}
.row svg{width:3.1mm;height:3.1mm;flex:none;color:#B89B62}
.oab{margin-top:1.2mm;font-size:5pt;letter-spacing:.14em;text-transform:uppercase;color:#292D32;opacity:.7}
.ph{outline:.2mm dashed #c0392b;outline-offset:.4mm}
</style></head><body>
<section class="card front" id="frente"><div class="glow"></div><div class="frame"></div>
 <div class="c"><div class="mono">GA</div><div class="name">Gabriel <i>Aziz</i></div><div class="rule"></div><div class="role">Advogado · Direito do Consumidor</div></div></section>
<section class="card back" id="verso"><div class="band"></div>
 <div class="bmono"><div class="ring"><span>GA</span></div><div class="bl"></div></div>
 <div class="info">
  <div class="n">Gabriel Aziz</div><div class="r">Advogado · Direito do Consumidor</div><div class="l"></div>

  <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span class="ph">contato@gabrielaziz.adv.br</span></div>
  <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".9" fill="currentColor" stroke="none"/></svg><span>@_gabriel_aziz</span></div>
  <div class="oab ph">OAB/UF 00.000</div>
 </div></section>
</body></html>
